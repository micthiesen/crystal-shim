ize="17">Copper to NPTH: 0.218788 mm</text><text x="915" y="497" font-size="17">Area: 0.636350 mm²</text><text x="915" y="524" font-size="17">1:1 paste area change: −5.12%</text><text x="35" y="579" font-size="18">Dashed circle = JLC 0.20 mm copper exclusion around the 0.65 mm NPTH.</text><text x="35" y="610" font-size="18">Same 0.60 × 1.15 mm outer bounds and unchanged pad/hole centres in all panels.</text><text x="35" y="641" font-size="18">Apply to A1+B12 and A12+B1: four logical pads, two physical copper areas and two stencil apertures.</text><text x="35" y="680" font-size="18">U10: 0.20 / 0.35 mm capped vias, original centres, annulus 0.075 mm; retain mask and stencil.</text><text x="35" y="713" font-size="18">U1: interstitial 0.20 / 0.45 mm vias clear paste by 0.2182 mm; specify top and bottom tenting.</text><text x="35" y="754" font-size="16">Nominal design geometry. Fabricator process capability and physical thermal qualification remain distinct.</text></g></svg>