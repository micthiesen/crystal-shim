<rect width="1200" height="690" fill="#fafafa"/>
<style>text{font-family:Arial,sans-serif;fill:#182b3a;font-size:15px}.small{font-size:13px}.head{font-weight:700;font-size:21px}.dim{stroke:#556;stroke-width:1.4;fill:none}</style>
<text x="32" y="35" class="head">RV1 proposed final-part acceptance volume</text>
<text x="32" y="60">Engineering allocation and physical inspection contract; not a manufacturer Cy or universal fit guarantee</text>
<rect x="78.0" y="113.0" width="348" height="348" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="84.0" y="119.0" width="336" height="336" fill="none" stroke="#c37918" stroke-width="2" stroke-dasharray=""/>
<rect x="90.0" y="125.0" width="324" height="324" fill="none" stroke="#146a88" stroke-width="2" stroke-dasharray=""/>
