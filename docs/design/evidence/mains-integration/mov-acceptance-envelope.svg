<circle cx="207.0" cy="287" r="5.2" fill="#773c23"/>
<circle cx="297.0" cy="287" r="5.2" fill="#773c23"/>
<line x1="192" y1="287" x2="312" y2="287" stroke="#995d40"/>
<circle cx="252" cy="287" r="3" fill="#222"/>
<rect x="150.0" y="233.0" width="204" height="108" rx="40" fill="#bddad8" stroke="#318279" transform="rotate(20 252 287)"/>
<text x="164" y="255" class="small">Illustrative body only</text>
<text x="70" y="488">Blue: actual installed union ≤27 × 27 mm</text>
<text x="70" y="510">Orange: keep existing 28 × 28 mm reserve</text>
<text x="70" y="532">Dashed: existing 29 × 29 mm courtyard</text>
<text x="70" y="560">No assumed body centering. Both orientations of the</text>
<text x="70" y="581">nonpolar part allowed if every acceptance limit passes.</text>
<text x="665" y="100">Side view; Z referenced to finished PCB top</text>
<rect x="662" y="414" width="400" height="16" fill="#467c53"/>
<line x1="662" y1="149.0" x2="1062" y2="149.0" stroke="#c37918" stroke-width="2"/>
<line x1="662" y1="154" x2="1062" y2="154" stroke="#146a88" stroke-width="2"/>
<text x="662" y="137.0">Reserved ceiling Z26.5; actual top ≤Z26.0 mm</text>
<ellipse cx="858" cy="279" rx="51" ry="89" fill="#bddad8" stroke="#318279" transform="rotate(4 858 279)"/>
<path d="M842 355 V392 l-3 4 l3 4 V445 M874 355 V392 l3 4 l-3 4 V445" stroke="#773c23" stroke-width="3" fill="none"/>
<text x="662" y="459">Seat plane Z0.5..1.0 mm, held independently</text>
<text x="662" y="481">Below board: tail plus solder ≤2.0 mm</text>
<text x="662" y="508">Top/body graphics are illustrative, not a seated STEP.</text>
<text x="662" y="531">Removable fixture supports bare leads without bending</text>
<text x="662" y="553">or loading coating. No permanent jig inside the enclosure.</text>
<text x="32" y="650">Final fit check includes yaw ≤20°, lean ≤5°, inspection error budget, no forced leads, soldering and metal clearances.</text>
