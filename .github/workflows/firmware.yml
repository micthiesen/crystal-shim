name: Firmware

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["firmware/**", "scripts/with-esp-toolchain.sh", "scripts/check-tls.sh", "scripts/check_tls_features.py", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "scripts/with-esp-toolchain.sh", "scripts/check-tls.sh", "scripts/check_tls_features.py", ".github/workflows/firmware.yml"]

jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TLS C build tools
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/tls-tests
      - run: sh scripts/check-tls.sh

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check actual partition selection against the host parser
        working-directory: firmware/partition-tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/app
    steps:
      - uses: actions/checkout@v4
      - name: Install TLS C build tools
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/app
      - run: cargo fmt --check
      - run: sh ../../scripts/with-esp-toolchain.sh cargo clippy --locked --all-targets -- -D warnings
      - run: sh ../../scripts/with-esp-toolchain.sh cargo build --locked --release
