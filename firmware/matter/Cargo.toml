[package]
name = "crystal-shim-matter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
crystal-shim-core = { path = "../core" }
# Exact data-model/persistence API from Stillair's locked rs-matter-embassy stack.
# Radio and crypto assembly remain outside this adapter crate.
rs-matter = { version = "=0.2.0", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
embassy-futures = "0.1"
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(unix)'.dependencies]
# Host provisioning transport only; absent from the ESP target dependency graph.
libc = "=0.2.189"

[dev-dependencies]
embedded-storage = "0.3"
embedded-storage-async = "0.4"
sequential-storage = "3"
