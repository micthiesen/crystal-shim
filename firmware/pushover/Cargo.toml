[package]
name = "crystal-shim-pushover"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
crystal-shim-core = { path = "../core" }
edge-http = { version = "=0.8.0", default-features = false, features = ["io"] }
embedded-io-async = { version = "=0.7.0", default-features = false }
embassy-futures = "0.1"
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
zeroize = { version = "=1.9.0", default-features = false }
